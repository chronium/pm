<div class="shell" [class.drawer-open]="layout.mobileSidebarOpen()">
  <aside id="pm-sidebar" class="sidebar" aria-label="Tasks navigation">
    <nav aria-label="Task views">
      <a routerLink="/tasks" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        >All tasks</a
      >
      <a
        routerLink="/tasks/new"
        queryParamsHandling="preserve"
        (click)="taskNavigation.captureOrigin($event.currentTarget)"
        >New task</a
      >
      <a class="settings-link" routerLink="/tasks/settings" routerLinkActive="active">
        <ng-icon name="cssOptions" aria-hidden="true" />
        <span>Settings</span>
      </a>
    </nav>
  </aside>

  <button
    class="backdrop"
    type="button"
    aria-label="Close navigation"
    tabindex="-1"
    (click)="layout.closeMobileSidebar()"
  ></button>

  <main class="content" [attr.inert]="layout.mobileSidebarOpen() ? '' : null">
    <router-outlet />
  </main>
</div>
