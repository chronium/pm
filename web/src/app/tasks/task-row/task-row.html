<a [attr.href]="href()" [attr.aria-current]="selected() ? 'true' : null" (click)="open($event)">
  <span class="task-identity"
    ><span class="task-id">{{ task().id }}</span
    ><span class="task-title">{{ task().title }}</span></span
  >
  <span class="task-context"
    ><span>{{ task().track }}</span
    ><span aria-hidden="true">·</span><span>{{ task().milestone ?? 'Unassigned' }}</span></span
  >
  <span class="task-badges">
    <pm-badge
      class="priority-badge"
      [tone]="priorityTone(task().priority)"
      [title]="'Effective priority from ' + task().prioritySource"
      >Priority: {{ task().priority }}</pm-badge
    >
    <pm-badge
      class="dependency-badge"
      [tone]="dependencyTone(task())"
      [title]="task().dependencies.summary"
      >Dependencies: {{ task().dependencies.ready ? 'ready' : 'blocked' }}</pm-badge
    >
    <pm-badge
      class="activation-badge"
      [tone]="activationTone(task())"
      [title]="task().activation.summary"
      >{{ activationLabel(task()) }}</pm-badge
    >
  </span>
  @if (task().descriptionPreview) {
    <span class="task-preview">{{ task().descriptionPreview }}</span>
  }
</a>
