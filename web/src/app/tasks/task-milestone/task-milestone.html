<summary class="milestone-summary" [id]="headingId()">
  <ng-icon class="milestone-disclosure" name="cssChevronRight" aria-hidden="true" />
  <span class="milestone-name">{{ milestone().name }}</span>
  <span
    class="milestone-count"
    [attr.aria-label]="taskCount() + (taskCount() === 1 ? ' task' : ' tasks')"
    >{{ taskCount() }}</span
  >
</summary>
<div class="status-groups">
  @for (state of milestone().states; track state.key) {
    @if (state.tasks.length > 0) {
      <details
        pmTaskStatusGroup
        class="status-group"
        [state]="state"
        [selectedTaskId]="selectedTaskId()"
        [open]="openStates()[state.key]"
        (openChange)="changed(state, $event)"
      ></details>
    }
  }
</div>
