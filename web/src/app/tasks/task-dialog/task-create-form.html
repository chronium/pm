<form class="task-form" (submit)="submit($event)" novalidate>
  @if (apiError()) {
    <p class="form-error" role="alert">{{ apiError() }}</p>
  }
  <pm-form-field>
    <label for="new-task-title">Title</label>
    <input
      id="new-task-title"
      pmControl
      [formField]="taskForm.title"
      autocomplete="off"
      autofocus
    />
    @if (taskForm.title().touched() && firstError(taskForm.title())) {
      <p pmFieldMessage class="field-error">{{ firstError(taskForm.title()) }}</p>
    }
  </pm-form-field>
  <div class="form-grid">
    <pm-form-field>
      <label for="new-task-track">Track</label>
      <select id="new-task-track" pmControl [formField]="taskForm.track">
        @for (track of tracks(); track track.key) {
          <option [value]="track.key">{{ track.name }}</option>
        }
      </select>
    </pm-form-field>
    <pm-form-field>
      <label for="new-task-milestone">Milestone</label>
      <select id="new-task-milestone" pmControl [formField]="taskForm.milestone">
        <option value="">No milestone</option>
        @for (milestone of milestones(); track milestone.key) {
          <option [value]="milestone.key">{{ milestone.name }}</option>
        }
      </select>
    </pm-form-field>
  </div>
  <pm-form-field>
    <label id="new-task-description">Description</label>
    <pm-markdown-editor
      pmControl
      [formField]="taskForm.description"
      label="Description"
      aria-labelledby="new-task-description"
    />
    <p pmFieldMessage>Markdown supported.</p>
  </pm-form-field>
  <div class="form-actions">
    <button
      type="button"
      class="pm-button pm-button--secondary"
      [disabled]="pending()"
      (click)="cancelled.emit()"
    >
      Cancel
    </button>
    <button
      type="submit"
      class="pm-button pm-button--primary"
      [disabled]="pending() || !taskForm().valid()"
    >
      {{ pending() ? 'Creating…' : 'Create task' }}
    </button>
  </div>
</form>
