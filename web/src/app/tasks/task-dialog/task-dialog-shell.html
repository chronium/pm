<dialog
  #dialog
  class="task-dialog pm-frosted-surface"
  [attr.aria-labelledby]="chrome() ? headingId : null"
  [attr.aria-label]="chrome() ? null : dialogTitle()"
  (cancel)="cancel($event)"
  (click)="backdropClick($event)"
>
  <div
    class="task-dialog-frame"
    [class.task-dialog-frame--plain]="!chrome()"
    [attr.aria-busy]="pending()"
  >
    @if (chrome()) {
      <header class="task-dialog-header">
        <div>
          <span class="task-dialog-eyebrow">{{ eyebrow() }}</span>
          <h2 [id]="headingId">{{ dialogTitle() }}</h2>
        </div>
        <button
          type="button"
          class="dialog-close"
          aria-label="Close task dialog"
          [disabled]="pending()"
          (click)="closeIntent.emit()"
        >
          ×
        </button>
      </header>
    }
    <div class="task-dialog-scroll"><ng-content /></div>
  </div>
</dialog>
