@if (visualStyle.style() === 'exploration') {
  <details class="tuning-panel pm-frosted-surface" open>
    <summary>Visual tuning</summary>
    <div class="controls">
      <label>
        <span
          >Satin fill <output>{{ tuning.values().satinOpacity }}%</output></span
        >
        <input
          type="range"
          min="0"
          max="100"
          [value]="tuning.values().satinOpacity"
          (input)="update('satinOpacity', $event)"
        />
      </label>
      <label>
        <span
          >Satin noise <output>{{ tuning.values().satinNoise }}%</output></span
        >
        <input
          type="range"
          min="0"
          max="100"
          [value]="tuning.values().satinNoise"
          (input)="update('satinNoise', $event)"
        />
      </label>
      <label>
        <span
          >Frosted fill <output>{{ tuning.values().frostedFill }}%</output></span
        >
        <input
          type="range"
          min="0"
          max="30"
          [value]="tuning.values().frostedFill"
          (input)="update('frostedFill', $event)"
        />
      </label>
      <label>
        <span
          >Frosted noise <output>{{ tuning.values().frostedNoise }}%</output></span
        >
        <input
          type="range"
          min="0"
          max="20"
          [value]="tuning.values().frostedNoise"
          (input)="update('frostedNoise', $event)"
        />
      </label>
      <button type="button" (click)="tuning.reset()">Reset</button>
    </div>
  </details>
}
