<div class="style-switch pm-frosted-surface" role="group" aria-label="Visual style">
  <button
    type="button"
    aria-label="Use current visual style"
    title="Current visual style"
    [attr.aria-pressed]="visualStyle.style() === 'current'"
    (click)="select('current')"
  >
    A
  </button>
  <button
    type="button"
    aria-label="Use exploration visual style"
    title="Exploration visual style"
    [attr.aria-pressed]="visualStyle.style() === 'exploration'"
    (click)="select('exploration')"
  >
    B
  </button>
</div>
