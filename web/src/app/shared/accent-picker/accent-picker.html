<div class="accent-options" role="group" aria-label="Project accent color">
  @for (option of options; track option.id) {
    <button
      type="button"
      [disabled]="disabled()"
      [attr.aria-pressed]="preference() === option.id"
      (click)="select(option.id)"
    >
      <span class="swatch" [attr.data-accent]="option.id" aria-hidden="true"></span>
      <span>{{ option.label }}</span>
    </button>
  }
</div>
