<dialog
  #dialog
  class="dialog pm-frosted-surface pm-frosted-dialog"
  [attr.aria-labelledby]="headingId"
  (cancel)="handleNativeCancel($event)"
  (click)="backdrop($event)"
>
  <div class="dialog-body">
    <h2 [id]="headingId">{{ heading() }}</h2>
    <p>{{ message() }}</p>
    @if (error()) {
      <p class="dialog-error" role="alert">{{ error() }}</p>
    }
  </div>
  <div class="dialog-actions">
    <button
      type="button"
      class="pm-button pm-button--secondary"
      autofocus
      [disabled]="pending()"
      (click)="cancel()"
    >
      {{ cancelLabel() }}
    </button>
    <button
      type="button"
      class="pm-button pm-button--danger"
      [disabled]="pending()"
      (click)="confirm()"
    >
      {{ pending() ? 'Working…' : confirmLabel() }}
    </button>
  </div>
</dialog>
