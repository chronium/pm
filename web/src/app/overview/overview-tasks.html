<section class="overview-section overview-tasks" [attr.aria-labelledby]="headingId()">
  <h2 [id]="headingId()">{{ title() }}</h2>

  @if (tasks().length) {
    <ul class="overview-task-list">
      @for (task of tasks(); track task.id) {
        <li pmTaskRow layout="overview" [task]="task" [selected]="false" [showState]="true"></li>
      }
    </ul>
  } @else {
    <p class="overview-empty">No tasks match this section.</p>
  }
</section>
