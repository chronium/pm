<pm-overview-section [headingId]="headingId()" [title]="title()">
  @if (tasks().length) {
    <ul class="overview-task-list">
      @for (task of tasks(); track task.id) {
        <li pmTaskRow layout="overview" [task]="task" [selected]="false" [showState]="true"></li>
      }
    </ul>
  } @else {
    <p class="overview-empty">No tasks match this section.</p>
  }
</pm-overview-section>
