<section class="component-page pm-frosted-surface pm-scroll-surface pm-component-surface">
  <header class="component-header">
    <p>Components</p>
    <h1>Buttons</h1>
  </header>

  <section class="specimen" aria-labelledby="button-variants">
    <h2 id="button-variants">Variants</h2>
    <div class="specimen-content">
      <button type="button" pmButton="primary">Create task</button>
      <button type="button" pmButton="secondary">Edit details</button>
      <button type="button" pmButton="ghost">Cancel</button>
      <button type="button" pmButton="danger">Remove task</button>
    </div>
  </section>

  <section class="specimen" aria-labelledby="button-disabled">
    <h2 id="button-disabled">Disabled</h2>
    <div class="specimen-content">
      <button type="button" pmButton="primary" disabled>Create task</button>
      <button type="button" pmButton="secondary" disabled>Edit details</button>
      <button type="button" pmButton="ghost" disabled>Cancel</button>
      <button type="button" pmButton="danger" disabled>Remove task</button>
    </div>
  </section>

  <section class="specimen" aria-labelledby="button-links">
    <h2 id="button-links">Links</h2>
    <div class="specimen-content">
      <a pmButton="primary" routerLink="/tasks">Open tasks</a>
      <a pmButton="secondary" routerLink="/wiki">Open wiki</a>
    </div>
  </section>

  <section class="specimen" aria-labelledby="button-labels">
    <h2 id="button-labels">Long labels</h2>
    <div class="specimen-content specimen-content--constrained">
      <button type="button" pmButton="primary">
        Create a task and continue editing project details
      </button>
    </div>
  </section>
</section>
