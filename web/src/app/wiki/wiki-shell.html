<div class="shell" [class.drawer-open]="layout.mobileSidebarOpen()">
  <aside id="pm-sidebar" class="sidebar" aria-label="Wiki navigation">
    <nav class="wiki-primary-nav" aria-label="Wiki views">
      <a routerLink="/wiki" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="layout.closeMobileSidebar()">Wiki home</a>
      <a routerLink="/wiki/new" routerLinkActive="active" (click)="layout.closeMobileSidebar()">New page</a>
    </nav>
    <div class="wiki-tree-scroll" aria-label="Wiki pages">
      @if (store.tree().length) { <pm-wiki-tree [nodes]="store.tree()" /> }
      @else if (!store.indexLoading()) { <p class="wiki-tree-empty">No pages yet.</p> }
    </div>
  </aside>

  <button
    class="backdrop"
    type="button"
    aria-label="Close navigation"
    tabindex="-1"
    (click)="layout.closeMobileSidebar()"
  ></button>

  <main class="content" [attr.inert]="layout.mobileSidebarOpen() ? '' : null">
    <router-outlet />
  </main>
</div>
