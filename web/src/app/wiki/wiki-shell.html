<div class="shell" [class.drawer-open]="layout.mobileSidebarOpen()">
  <aside id="pm-sidebar" class="sidebar" aria-label="Wiki navigation">
    <div class="sidebar-heading">Wiki</div>
    <nav aria-label="Wiki views">
      <a routerLink="/wiki" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">All pages</a>
    </nav>
  </aside>

  <button
    class="backdrop"
    type="button"
    aria-label="Close navigation"
    tabindex="-1"
    (click)="layout.closeMobileSidebar()"
  ></button>

  <main class="content" [attr.inert]="layout.mobileSidebarOpen() ? '' : null">
    <router-outlet />
  </main>
</div>
