<div class="shell" [class.drawer-open]="layout.mobileSidebarOpen()">
  <aside id="pm-sidebar" class="sidebar" aria-label="Wiki navigation">
    <pm-mobile-project-navigation />
    <nav class="wiki-primary-nav" aria-label="Wiki views">
      <a
        [routerLink]="projectContext.wikiRoot()"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="layout.closeMobileSidebar()"
        >Wiki home</a
      >
      @if (!projectContext.readOnly()) {
        <a
          [routerLink]="projectContext.wikiCreateUrl()"
          routerLinkActive="active"
          (click)="layout.closeMobileSidebar()"
          >New page</a
        >
      }
    </nav>
    <div class="wiki-tree-scroll" aria-label="Wiki pages">
      @if (store.tree().length) {
        <pm-wiki-tree [nodes]="store.tree()" />
      } @else if (!store.indexLoading()) {
        <p class="wiki-tree-empty">No pages yet.</p>
      }
    </div>
  </aside>

  <button
    class="backdrop"
    type="button"
    aria-label="Close navigation"
    tabindex="-1"
    (click)="layout.closeMobileSidebar()"
  ></button>

  <main class="content" [attr.inert]="layout.mobileSidebarOpen() ? '' : null">
    @if (store.liveUpdateUnavailable()) {
      <p class="live-update-status" role="status">Live updates unavailable; retrying</p>
    }
    <router-outlet />
  </main>
</div>
