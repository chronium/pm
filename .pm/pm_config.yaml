  site-overview-discovery:
    title: Published project Overview discovery
    description: >-
      ## Outcome


      Deliver an approved, implementation-ready design for opt-in project Overview pages, demonstrated through isolated responsive prototypes using realistic PM project data.


      ## Scope


      - Define a dedicated `site:` configuration boundary with `enabled: true` as the opt-in.

      - Keep Overview available in live and embedded PM while Tasks remains their default route; enabled static exports open Overview by default.

      - Define a uniform section vocabulary for hero, milestone, tasks, wiki, and wiki-sourced Markdown.

      - Select the highest-priority active milestone by default, using configured milestone order as the tie-breaker, while allowing an explicit milestone override.

      - Reuse PM task-search syntax and normal task ordering for task sections.

      - Reject invalid explicit milestone, wiki, Markdown-source, and task-filter configuration with actionable publishing diagnostics.

      - Demonstrate polished desktop and mobile compositions in isolated Storybook or component-gallery fixtures.


      ## Exclusions


      - No production route, configuration parsing, snapshot, or static-export behavior changes.

      - No Settings UI or free-form page-builder controls.

      - No production implementation milestone or task plan until the prototype and contract are approved.


      ## Evidence


      - A settled configuration and resolved-data contract.

      - Reviewable responsive prototypes covering representative project types and important states.

      - Recorded design decisions sufficient to create a separate production implementation milestone without reopening foundational choices.
    priority: urgent
    requiredActivationTriggers: []
    delivery:
      at: 2026-08-09T15:01:58.0132590+00:00
      mode: ordinary
      acceptedTaskIds: []
  deliverable-timeline-discovery:
    title: Generated deliverable timeline discovery
    description: >-
      ## Outcome


      Approve a coherent generated deliverable timeline model that presents PM delivery history and forward delivery paths without fabricating schedule dates.


      ## Scope


      - A vertical time spine with deliverable cards alternating left and right at wide viewports.

      - Factual delivery history from persisted delivery records.

      - A generated forward delivery path from lifecycle, activation, dependency, priority, and progress data.

      - A clearly separated future calendar-roadmap concept based only on optional authored target dates or windows.

      - Responsive, accessible, repository-backed presentation suitable for live and static PM views.


      ## Exclusions


      - Production implementation during discovery.

      - A task-level Gantt chart, effort estimation, resource scheduling, or inferred calendar dates.

      - Adding Timeline to the published Overview vocabulary before its standalone model is approved.

      - Arbitrary visual layout configuration.


      ## Evidence


      An owner-approved prototype and design contract covering generation rules, branching, temporal semantics, responsive behavior, accessibility, linked-project boundaries, and implementation scope.
    priority: low
    requiredActivationTriggers: []
    delivery: null
  published-project-overview:
    title: Published project Overview
    description: >-
      ## Outcome


      Deliver opt-in published project Overview pages across live, embedded, linked-project, and static PM contexts using the approved single and split composition contract.


      ## Scope


      - Persist and validate the dedicated `site:` YAML configuration without changing projects that omit it.

      - Resolve one atomic current- or linked-project Overview document from project configuration and PM data.

      - Expose revisioned Overview read APIs and include the resolved document in static snapshots.

      - Render the approved hero, milestone, tasks, wiki, Markdown, and copyright sections.

      - Support the implicit single layout and the bounded 44/56 split layout with deterministic mobile collapse.

      - Keep live and embedded PM Tasks-first while enabled static exports open Overview first.

      - Configure PM's own published Overview as the initial production showcase.


      ## Exclusions


      - No Settings editor in v1.

      - No merged or nested sections, arbitrary geometry, custom styling, raw HTML, configurable navigation, timeline, activity, task-statistics, or linked-project section types.

      - No inferred copyright or legal text.


      ## Evidence


      A backward-compatible YAML contract, validated application resolver, current and linked APIs, schema-v6 static snapshots, accessible responsive Angular presentation, PM dogfood configuration, and a passing complete release gate.
    priority: urgent
    requiredActivationTriggers: []
    delivery:
      at: 2026-08-11T06:11:44.4012590+00:00
      mode: ordinary
      acceptedTaskIds: []
  active-work-visibility:
    title: Focused active-work views
    description: >-
      ## Outcome


      PM task discovery focuses on work that still belongs to an undelivered milestone by default, while delivered history remains available through one explicit, consistent opt-in.


      ## Scope


      - Hide delivered milestones and their assigned tasks by default in task-listing and task-search surfaces.

      - Provide `--include-delivered` in the CLI and `includeDelivered` in MCP and HTTP read contracts.

      - Add a per-project **Show delivered** toggle to the live and static task pages.

      - Apply the same visibility choice to milestone navigation, board groups, counts, and task search.

      - Keep complete project history in static snapshots so published sites can reveal delivered work locally.

      - Preserve linked-project and family-read behavior under the same default.


      ## Exclusions


      - Do not hide completed tasks that belong to active, inactive, or ready-to-deliver milestones.

      - Do not hide tracks merely because their visible count is zero.

      - Do not make `in:all` task search include delivered work.

      - Do not filter direct task reads, Settings, the activation switchboard, delivery controls, or explicitly configured Overview sections.


      ## Evidence


      - Shared service tests demonstrate explicit delivered-lifecycle filtering and opt-in recovery.

      - CLI, MCP, live API, linked-project, and static-snapshot contract tests agree on the default and override.

      - Storybook and end-to-end coverage demonstrate the accessible web toggle across writable, read-only, desktop, and mobile task pages.

      - The complete PM release gate passes.
    priority: high
    requiredActivationTriggers: []
    delivery: null
  github-action-publishing:
    title: Reusable PM GitHub Action
    description: >-
      ## Outcome


      Publish a reusable `chronium/pm` GitHub Action that lets PM-based repositories validate project state and generate static sites without installing PM or invoking its OCI image directly.


      ## Scope


      - Expose a controlled Action command surface for `doctor`, `site-build`, and `version`.

      - Package released PM binaries and embedded web assets in a small Linux OCI runtime used internally by the Action.

      - Validate project and output paths beneath the checked-out workspace, translate typed Action inputs without shell evaluation, and preserve PM exit codes.

      - Write generated sites back into the GitHub workspace for subsequent artifact upload or deployment steps.

      - Publish a moving `latest` Action ref for closely coordinated repositories, a compatible major ref, and immutable release refs.

      - Couple every Action release to a tested immutable OCI image digest.

      - Separate PM's Action/runtime release workflow from its own static-site publishing workflow.

      - Dogfood the published `chronium/pm@latest` Action first in PM itself and then across the ChronoFall family.

      - Retain separately generated family project sites and normal PM project switching.


      ## Exclusions


      - Arbitrary shell or unrestricted PM CLI passthrough.

      - Repository mutation, automated write-back, milestone delivery, or activation overrides from CI.

      - Hiding Action defects by invoking local build outputs or the OCI image directly from dogfood publishing workflows.

      - Owning consumer deployment permissions or forcing a hosting provider.

      - General desktop, package-manager, or end-user PM distribution.


      ## Evidence


      - Action contract and command-dispatch tests cover accepted inputs, rejected commands and paths, exit-code propagation, and generated outputs.

      - Published Action refs resolve to a digest-pinned, smoke-tested OCI runtime.

      - PM's release workflow publishes the Action/runtime, while a separate workflow consumes `chronium/pm@latest` to validate PM and publish its static site.

      - The PM dogfood workflow exercises the same public Action contract available to an external repository.

      - The ChronoFall family workflow subsequently builds its project sites through `chronium/pm@latest` and preserves working cross-project navigation.
    priority: high
    requiredActivationTriggers: []
    delivery: null
