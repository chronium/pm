  site-overview-discovery:
    title: Published project Overview discovery
    description: >-
      ## Outcome


      Deliver an approved, implementation-ready design for opt-in project Overview pages, demonstrated through isolated responsive prototypes using realistic PM project data.


      ## Scope


      - Define a dedicated `site:` configuration boundary with `enabled: true` as the opt-in.

      - Keep Overview available in live and embedded PM while Tasks remains their default route; enabled static exports open Overview by default.

      - Define a uniform section vocabulary for hero, milestone, tasks, wiki, and wiki-sourced Markdown.

      - Select the highest-priority active milestone by default, using configured milestone order as the tie-breaker, while allowing an explicit milestone override.

      - Reuse PM task-search syntax and normal task ordering for task sections.

      - Reject invalid explicit milestone, wiki, Markdown-source, and task-filter configuration with actionable publishing diagnostics.

      - Demonstrate polished desktop and mobile compositions in isolated Storybook or component-gallery fixtures.


      ## Exclusions


      - No production route, configuration parsing, snapshot, or static-export behavior changes.

      - No Settings UI or free-form page-builder controls.

      - No production implementation milestone or task plan until the prototype and contract are approved.


      ## Evidence


      - A settled configuration and resolved-data contract.

      - Reviewable responsive prototypes covering representative project types and important states.

      - Recorded design decisions sufficient to create a separate production implementation milestone without reopening foundational choices.
    priority: urgent
    requiredActivationTriggers: []
    delivery:
      at: 2026-08-09T15:01:58.0132590+00:00
      mode: ordinary
      acceptedTaskIds: []
  deliverable-timeline-discovery:
    title: Generated deliverable timeline discovery
    description: >-
      ## Outcome


      Approve a coherent generated deliverable timeline model that presents PM delivery history and forward delivery paths without fabricating schedule dates.


      ## Scope


      - A vertical time spine with deliverable cards alternating left and right at wide viewports.

      - Factual delivery history from persisted delivery records.

      - A generated forward delivery path from lifecycle, activation, dependency, priority, and progress data.

      - A clearly separated future calendar-roadmap concept based only on optional authored target dates or windows.

      - Responsive, accessible, repository-backed presentation suitable for live and static PM views.


      ## Exclusions


      - Production implementation during discovery.

      - A task-level Gantt chart, effort estimation, resource scheduling, or inferred calendar dates.

      - Adding Timeline to the published Overview vocabulary before its standalone model is approved.

      - Arbitrary visual layout configuration.


      ## Evidence


      An owner-approved prototype and design contract covering generation rules, branching, temporal semantics, responsive behavior, accessibility, linked-project boundaries, and implementation scope.
    priority: low
    requiredActivationTriggers: []
    delivery: null
  published-project-overview:
    title: Published project Overview
    description: >-
      ## Outcome


      Deliver opt-in published project Overview pages across live, embedded, linked-project, and static PM contexts using the approved single and split composition contract.


      ## Scope


      - Persist and validate the dedicated `site:` YAML configuration without changing projects that omit it.

      - Resolve one atomic current- or linked-project Overview document from project configuration and PM data.

      - Expose revisioned Overview read APIs and include the resolved document in static snapshots.

      - Render the approved hero, milestone, tasks, wiki, Markdown, and copyright sections.

      - Support the implicit single layout and the bounded 44/56 split layout with deterministic mobile collapse.

      - Keep live and embedded PM Tasks-first while enabled static exports open Overview first.

      - Configure PM's own published Overview as the initial production showcase.


      ## Exclusions


      - No Settings editor in v1.

      - No merged or nested sections, arbitrary geometry, custom styling, raw HTML, configurable navigation, timeline, activity, task-statistics, or linked-project section types.

      - No inferred copyright or legal text.


      ## Evidence


      A backward-compatible YAML contract, validated application resolver, current and linked APIs, schema-v6 static snapshots, accessible responsive Angular presentation, PM dogfood configuration, and a passing complete release gate.
    priority: urgent
    requiredActivationTriggers: []
    delivery: null
