<section id="settings" class="settings-page" aria-live="polite">
  <header class="settings-header">
    <h2>Project settings</h2>
  </header>
{{error}}
{{health}}
  <section class="settings-section" aria-labelledby="statuses-settings-title">
    <h3 id="statuses-settings-title">Statuses</h3>
    <form class="settings-add" hx-post="/settings/statuses" hx-target="#settings" hx-swap="outerHTML">
      <label data-field>Key <input name="key" autocomplete="off" required></label>
      <label data-field>Name <input name="name" autocomplete="off" required></label>
      <button type="submit" class="small">Add status</button>
    </form>
    <div class="settings-list">
{{statusItems}}
    </div>
  </section>
  <section class="settings-section" aria-labelledby="milestones-settings-title">
    <h3 id="milestones-settings-title">Milestones</h3>
    <form class="settings-add" hx-post="/settings/milestones" hx-target="#settings" hx-swap="outerHTML">
      <label data-field>Key <input name="key" autocomplete="off" required></label>
      <label data-field>Title <input name="title" autocomplete="off" required></label>
      <button type="submit" class="small">Add milestone</button>
    </form>
    <div class="settings-list">
{{milestoneItems}}
    </div>
  </section>
  <section class="settings-section" aria-labelledby="tracks-settings-title">
    <h3 id="tracks-settings-title">Tracks</h3>
    <form class="settings-add" hx-post="/settings/tracks" hx-target="#settings" hx-swap="outerHTML">
      <label data-field>Key <input name="key" autocomplete="off" required></label>
      <label data-field>Name <input name="name" autocomplete="off" required></label>
      <button type="submit" class="small">Add track</button>
    </form>
    <div class="settings-list">
{{trackItems}}
    </div>
  </section>
</section>
