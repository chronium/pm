<section class="wiki-page wiki-editor-page" aria-labelledby="wiki-metadata-title">
  <header class="wiki-header">
{{breadcrumbs}}
    <p class="path">{{currentPath}}</p>
    <h2 id="wiki-metadata-title">Metadata</h2>
  </header>
  {{error}}
  <form class="wiki-form" method="post" action="/wiki/meta/{{currentPathUrl}}">
    <label data-field>Path<input name="path" value="{{path}}" autocomplete="off" required autofocus></label>
    <label data-field>Title<input name="title" value="{{title}}" required></label>
    <div class="form-actions">
      <button class="button" type="submit">Save</button>
      <a class="button outline" href="/wiki/{{currentPathUrl}}">Cancel</a>
    </div>
  </form>
  <section class="wiki-danger-zone" aria-labelledby="wiki-delete-title">
    <h3 id="wiki-delete-title">Delete</h3>
    <p>Permanently remove this wiki page.</p>
    <form class="wiki-form" method="post" action="/wiki/delete/{{currentPathUrl}}">
      <label data-field>Confirmation<input name="confirm" autocomplete="off" placeholder="delete"></label>
      <div class="form-actions">
        <button class="button danger" type="submit">Delete</button>
      </div>
    </form>
  </section>
</section>
