<section class="wiki-page wiki-editor-page" aria-labelledby="wiki-editor-title">
  <header class="wiki-header">
{{breadcrumbs}}
    <h2 id="wiki-editor-title">Edit {{title}}</h2>
  </header>
{{error}}
  <form class="wiki-form" method="post" action="/wiki/edit/{{pathUrl}}">
    <label data-field>Markdown<textarea id="wiki-markdown" name="markdown" rows="28" required autofocus data-markdown-editor>{{markdown}}</textarea></label>
    <div class="form-actions">
      <button type="submit">Save</button>
      <a class="button outline" href="/wiki/{{pathUrl}}">Cancel</a>
    </div>
  </form>
{{editorAssets}}
</section>
