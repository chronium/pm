<article class="detail">
  <form method="dialog" class="dialog-close">
    <button type="submit" aria-label="Close">x</button>
  </form>
  <h2>New task</h2>
  <form class="task-form" hx-post="/task/new" hx-target="#task-dialog" hx-swap="innerHTML">
{{filterInputs}}
    <label>Title<input name="title" required autofocus></label>
    <label>Track<select name="track" required>
{{trackOptions}}
    </select></label>
    <label>Milestone<select name="milestone">
      <option value="">No milestone</option>
{{milestoneOptions}}
    </select></label>
    <label>Description<textarea name="description" rows="10"></textarea></label>
    <button type="submit">Create</button>
  </form>
</article>
