<article class="task-detail">
  <form method="dialog" class="dialog-close">
    <button type="submit" class="icon small ghost" aria-label="Close">x</button>
  </form>
  <header class="task-dialog-header">
    <div class="task-heading">
      <h2>{{title}}</h2>
      <div class="task-meta">
        <span class="id">{{taskId}}</span>
        <span>{{track}}</span>
        <span>{{state}}</span>
{{priority}}
        <time>{{modifiedAt}}</time>
      </div>
{{dependencies}}
    </div>
    <div class="task-dialog-actions">
      <button type="button" class="outline small" hx-get="/task/{{taskIdUrl}}/edit" hx-target="#task-dialog" hx-swap="innerHTML" hx-include="#filters">Edit</button>
    </div>
  </header>
  <textarea id="task-markdown-source" readonly hidden>{{description}}</textarea>
  <div id="task-content" class="task-description markdown-content" aria-live="polite"></div>
  <pre id="task-markdown-fallback" class="task-description markdown-fallback">{{description}}</pre>
  <footer class="task-dialog-footer">
    <form class="task-state-compact" hx-post="/task/{{taskIdUrl}}/state" hx-target="#task-dialog" hx-swap="innerHTML" hx-include="#filters, closest form">
      <label data-field><span class="sr-only">State</span><select name="targetState" aria-label="State">
{{stateOptions}}
      </select></label>
      <button type="submit" class="small outline">Move</button>
    </form>
    <details class="task-file-meta">
      <summary>File</summary>
      <p class="path">{{filePath}}</p>
    </details>
    <div class="remove-area">
      <button type="button" class="ghost small" data-variant="danger" data-confirm-remove>Remove</button>
      <div id="remove-confirmation" class="remove-confirmation" hidden>
        <p>This permanently removes the task file and state reference.</p>
        <form hx-post="/task/{{taskIdUrl}}/remove" hx-target="#task-dialog" hx-swap="innerHTML" hx-include="#filters">
          <button type="submit" class="small" data-variant="danger">Confirm remove</button>
        </form>
      </div>
    </div>
  </footer>
  <script src="https://unpkg.com/marked@18.0.5/lib/marked.umd.js"></script>
  <script src="https://unpkg.com/dompurify@3.4.11/dist/purify.min.js"></script>
  <script>
    (() => {
      const source = document.getElementById('task-markdown-source');
      const target = document.getElementById('task-content');
      const fallback = document.getElementById('task-markdown-fallback');
      if (!source || !target || !window.marked || !window.DOMPurify) return;

      target.innerHTML = window.DOMPurify.sanitize(window.marked.parse(source.value));
      fallback?.setAttribute('hidden', '');
    })();
  </script>
</article>
