<article class="detail">
  <form method="dialog" class="dialog-close">
    <button type="submit" class="icon small ghost" aria-label="Close">x</button>
  </form>
  <header>
    <h2>Edit {{taskId}}</h2>
  </header>
  <form class="task-form" hx-post="/task/{{taskIdUrl}}/edit" hx-target="#task-dialog" hx-swap="innerHTML">
{{filterInputs}}
    <label data-field>Markdown<textarea name="markdown" rows="22" required autofocus>{{markdown}}</textarea></label>
    <footer class="form-actions">
      <button type="submit">Save</button>
    </footer>
  </form>
</article>
