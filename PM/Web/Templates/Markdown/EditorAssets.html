<link rel="stylesheet" href="https://unpkg.com/easymde@2.20.0/dist/easymde.min.css">
<script src="https://unpkg.com/marked@18.0.5/lib/marked.umd.js"></script>
<script src="https://unpkg.com/dompurify@3.4.11/dist/purify.min.js"></script>
<script src="https://unpkg.com/easymde@2.20.0/dist/easymde.min.js"></script>
<script>
  (() => {
    const initializeMarkdownEditors = () => {
      if (!window.EasyMDE) return false;

      document.querySelectorAll('textarea[data-markdown-editor]').forEach((textarea) => {
        if (textarea.dataset.editorReady === 'true') return;
        textarea.dataset.editorReady = 'true';

        new window.EasyMDE({
          element: textarea,
          autofocus: textarea.hasAttribute('autofocus'),
          spellChecker: false,
          status: false,
          minHeight: textarea.dataset.markdownEditorMinHeight || '360px',
          renderingConfig: { singleLineBreaks: false },
          previewRender: (markdown) => {
            if (!window.marked || !window.DOMPurify) {
              const fallback = document.createElement('pre');
              fallback.textContent = markdown;
              return fallback.outerHTML;
            }

            return window.DOMPurify.sanitize(window.marked.parse(markdown));
          },
        });
      });

      return true;
    };

    if (!initializeMarkdownEditors()) {
      window.addEventListener('load', initializeMarkdownEditors, { once: true });
      window.setTimeout(initializeMarkdownEditors, 100);
      window.setTimeout(initializeMarkdownEditors, 500);
    }
  })();
</script>
