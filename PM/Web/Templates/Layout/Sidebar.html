    <aside class="sidebar" aria-label="Board navigation">
      <div class="sidebar-header">
        <h1>{{projectName}} Board</h1>
        <button type="button" hx-get="/task/new" hx-target="#task-dialog" hx-swap="innerHTML" hx-include="#filters">New task</button>
      </div>
      <form id="filters" class="filters" aria-hidden="true">
{{filterInputs}}
      </form>
      <nav class="board-nav">
        <a class="nav-item{{wholeProjectActive}}" href="/"{{wholeProjectAriaCurrent}}>Whole project</a>
        <a class="nav-item{{wikiActive}}" href="/wiki"{{wikiAriaCurrent}}>Wiki</a>
        <section class="nav-section" aria-labelledby="milestones-nav-title">
          <h2 id="milestones-nav-title">Milestones</h2>
          <a class="nav-item" href="/">View all milestones</a>
{{milestoneItems}}
        </section>
        <section class="nav-section" aria-labelledby="tracks-nav-title">
          <h2 id="tracks-nav-title">Tracks</h2>
          <a class="nav-item" href="/">View all tracks</a>
{{trackItems}}
        </section>
        <a class="nav-item settings-link{{settingsActive}}" href="/settings"{{settingsAriaCurrent}}>Settings</a>
      </nav>
    </aside>
