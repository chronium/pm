<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}}</title>
  <link rel="stylesheet" href="https://unpkg.com/@knadh/oat@0.6.2/oat.min.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/@knadh/oat@0.6.2/oat.min.js" defer></script>
  <style>
{{styles}}
  </style>
  <script>
    let restoringStateGroups = false;

    document.addEventListener('htmx:beforeSwap', (event) => {
      if ((event.detail.target.id === 'task-dialog' || event.detail.target.id === 'settings') &&
          event.detail.xhr.status >= 400) {
        event.detail.shouldSwap = true;
        event.detail.isError = false;
      }

      if (event.detail.target.id === 'board') {
        restoringStateGroups = true;
      }
    });

    document.addEventListener('htmx:afterSwap', (event) => {
      if (event.detail.target.id === 'task-dialog' &&
          event.detail.target.innerHTML.trim() &&
          !event.detail.target.querySelector('[data-close-dialog]')) {
        event.detail.target.showModal();
      }

      if (event.detail.target.id === 'board') {
        restoreStateGroups(event.detail.target);
      }
    });

    document.addEventListener('click', (event) => {
      if (event.target.matches('[data-confirm-remove]')) {
        document.getElementById('remove-confirmation')?.removeAttribute('hidden');
      }
    });

    function restoreStateGroups(root = document) {
      restoringStateGroups = true;
      root.querySelectorAll('.state-group[data-state-key]').forEach((group) => {
        const stored = readStateGroupPreference(group.dataset.stateKey);
        if (stored !== null) {
          group.open = stored === 'true';
        }
      });
      setTimeout(() => {
        restoringStateGroups = false;
      }, 0);
    }

    function readStateGroupPreference(stateKey) {
      try {
        return sessionStorage.getItem(`pm.state.${stateKey}.open`);
      } catch {
        return null;
      }
    }

    function writeStateGroupPreference(stateKey, open) {
      try {
        sessionStorage.setItem(`pm.state.${stateKey}.open`, open ? 'true' : 'false');
      } catch {
      }
    }

    function handleStateGroupToggle(event) {
      if (restoringStateGroups) {
        return;
      }

      const group = event.target.closest?.('.state-group[data-state-key]');
      if (group) {
        writeStateGroupPreference(group.dataset.stateKey, group.open);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      restoreStateGroups();
      setTimeout(() => {
        document.addEventListener('toggle', handleStateGroupToggle, true);
      }, 0);
    });
  </script>
</head>
<body>
{{topBar}}
  <div class="app-shell">
{{sidebar}}
    <main>
      <section id="board" aria-live="polite">
{{board}}
      </section>
      <dialog id="task-dialog" aria-live="polite" aria-label="Task detail" onclose="this.innerHTML = ''" oncancel="this.close()"></dialog>
    </main>
  </div>
</body>
</html>
